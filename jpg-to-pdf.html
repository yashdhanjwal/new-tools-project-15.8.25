<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Convert JPG images into a single, high-quality PDF document. Free, fast, and secure client-side conversion.">
    <title>JPG to PDF Converter - Free Tools by Yash</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            text-align: center;
        }
        #file-input {
            display: none;
        }
        .upload-area {
            border: 2px dashed var(--primary-color);
            border-radius: 8px;
            padding: 2rem;
            margin-top: 2rem;
            cursor: pointer;
        }
        .status {
            margin-top: 1rem;
            font-size: 1rem;
        }
        #preview-container {
            margin-top: 1rem;
        }
        #preview {
            max-width: 100%;
            max-height: 300px;
            border-radius: 5px;
            display: none;
        }
        #convert-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 1rem;
            display: none;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">Free Tools by Yash</a>
            <nav>
                <button id="theme-toggle">Toggle Dark Mode</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="tool-container">
                <h2>JPG to PDF Converter</h2>
                <p>Select a JPG image to convert it into a PDF document.</p>

                <label for="file-input" class="upload-area" id="upload-label">
                    <p>Click to select a JPG file</p>
                </label>
                <input type="file" id="file-input" accept="image/jpeg">

                <div id="preview-container">
                    <img id="preview" alt="Image Preview">
                </div>

                <div class="status" id="status-text"></div>
                <button id="convert-btn">Convert to PDF</button>
                <a id="download-btn" style="display: none; background: #28a745; color: white; padding: 0.8rem 1.5rem; border-radius: 5px; text-decoration: none; margin-top: 1rem; font-size: 1.1rem;">Download PDF</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 <a href="https://www.yashdhanjwal.com" target="_blank">Yash Dhanjwal</a>. All rights reserved.</p>
            <p>Contact: <a href="mailto:info@yashdhanjwal.com">info@yashdhanjwal.com</a> | New Delhi, India | +91 9990033043</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="js/script.js"></script> <!-- For theme toggle -->
    <script src="js/jpg-to-pdf.js"></script>
</body>
</html>
