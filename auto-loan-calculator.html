<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estimate your monthly car loan payments, total interest, and the total cost of your auto loan. Free and easy-to-use auto loan calculator.">
    <title>Auto Loan Calculator - Free Online Tools by Yash Dhanjwal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
        }
        .calculator-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input {
            padding: 0.7rem;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid var(--card-border);
        }
        .results-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
            text-align: center;
        }
        .result-box {
            padding: 1.5rem;
            background-color: var(--background-color);
            border-radius: 5px;
        }
        .result-box h3 {
            margin: 0;
            font-size: 1rem;
            color: var(--primary-color);
        }
        .result-box p {
            font-size: 1.75rem;
            font-weight: bold;
            margin: 0.5rem 0 0 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">Free Online Tools by Yash Dhanjwal</a>
            <nav>
                <a href="about.html">About</a>
                <button id="theme-toggle">Toggle Dark Mode</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="tool-container">
                <h2>Auto Loan Calculator</h2>
                <div class="calculator-form">
                    <div class="form-group">
                        <label for="vehicle-price">Vehicle Price ($)</label>
                        <input type="number" id="vehicle-price" placeholder="e.g., 25000">
                    </div>
                    <div class="form-group">
                        <label for="down-payment">Down Payment ($)</label>
                        <input type="number" id="down-payment" placeholder="e.g., 5000">
                    </div>
                    <div class="form-group">
                        <label for="interest-rate">Annual Interest Rate (%)</label>
                        <input type="number" id="interest-rate" placeholder="e.g., 4.5">
                    </div>
                    <div class="form-group">
                        <label for="loan-term">Loan Term (Months)</label>
                        <input type="number" id="loan-term" placeholder="e.g., 60">
                    </div>
                </div>

                <div class="results-summary">
                    <div class="result-box">
                        <h3>Monthly Payment</h3>
                        <p>$<span id="monthly-payment">0.00</span></p>
                    </div>
                    <div class="result-box">
                        <h3>Total Interest</h3>
                        <p>$<span id="total-interest">0.00</span></p>
                    </div>
                    <div class="result-box">
                        <h3>Total Loan Cost</h3>
                        <p>$<span id="total-cost">0.00</span></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 <a href="https://www.yashdhanjwal.com" target="_blank">Yash Dhanjwal</a> | Powered by Hostingial.com</p>
            <p>Contact: <a href="mailto:info@yashdhanjwal.com">info@yashdhanjwal.com</a> | New Delhi, India | +91 9990033043</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/auto-loan-calculator.js"></script>
</body>
</html>
