<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check the readability of your text using the Flesch-Kincaid index. Find out how easy your text is to understand.">
    <title>Readability Checker - Free Tools by Yash</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
        }
        textarea {
            width: 100%;
            height: 300px;
            padding: 1rem;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid var(--card-border);
            background-color: var(--background-color);
            color: var(--text-color);
            resize: vertical;
            margin-top: 1rem;
        }
        #check-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.1rem;
            margin-top: 1rem;
        }
        .results {
            margin-top: 2rem;
            text-align: left;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .result-box {
            background: var(--background-color);
            padding: 1rem;
            border-radius: 5px;
            text-align: center;
        }
        .result-box h4 {
            margin: 0 0 0.5rem 0;
            color: var(--primary-color);
        }
        .result-box p {
            margin: 0;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">Free Tools by Yash</a>
            <nav>
                <button id="theme-toggle">Toggle Dark Mode</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="tool-container">
                <h2>Readability Checker</h2>
                <p>Paste your text below to get its readability score.</p>
                <textarea id="text-input" placeholder="Type or paste your text here..."></textarea>
                <button id="check-btn">Check Readability</button>
                <div class="results" id="results-area" style="display:none;">
                    <div class="result-box">
                        <h4>Readability Score</h4>
                        <p id="score">-</p>
                        <small>(Higher is easier)</small>
                    </div>
                    <div class="result-box">
                        <h4>Grade Level</h4>
                        <p id="grade-level">-</p>
                    </div>
                    <div class="result-box">
                        <h4>Word Count</h4>
                        <p id="word-count">-</p>
                    </div>
                    <div class="result-box">
                        <h4>Sentence Count</h4>
                        <p id="sentence-count">-</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 <a href="https://www.yashdhanjwal.com" target="_blank">Yash Dhanjwal</a>. All rights reserved.</p>
            <p>Contact: <a href="mailto:info@yashdhanjwal.com">info@yashdhanjwal.com</a> | New Delhi, India | +91 9990033043</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/readability-checker.js"></script>
</body>
</html>
