<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Project your retirement savings and see how your investments can grow over time. Plan for your future with this easy-to-use retirement calculator.">
    <title>Retirement Savings Calculator - Free Online Tools by Yash Dhanjwal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tool-container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
        }
        .calculator-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            text-align: left;
        }
        .form-group label {
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .form-group input {
            padding: 0.7rem;
            font-size: 1rem;
            border-radius: 5px;
            border: 1px solid var(--card-border);
        }
        .results-summary {
            margin-top: 2rem;
            padding: 1.5rem;
            background-color: var(--background-color);
            border-radius: 5px;
            text-align: center;
        }
        .results-summary h3 {
            margin: 0;
            color: var(--primary-color);
        }
        .results-summary p {
            font-size: 2.5rem;
            font-weight: bold;
            margin: 0.5rem 0 0 0;
        }
        .result-breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo">Free Online Tools by Yash Dhanjwal</a>
            <nav>
                <a href="about.html">About</a>
                <button id="theme-toggle">Toggle Dark Mode</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="tool-container">
                <h2>Retirement Savings Calculator</h2>
                <div class="calculator-form">
                    <div class="form-group">
                        <label for="current-age">Current Age</label>
                        <input type="number" id="current-age" placeholder="e.g., 30">
                    </div>
                    <div class="form-group">
                        <label for="retirement-age">Retirement Age</label>
                        <input type="number" id="retirement-age" placeholder="e.g., 65">
                    </div>
                    <div class="form-group">
                        <label for="current-savings">Current Savings (₹)</label>
                        <input type="number" id="current-savings" placeholder="e.g., 500000">
                    </div>
                    <div class="form-group">
                        <label for="monthly-contribution">Monthly Contribution (₹)</label>
                        <input type="number" id="monthly-contribution" placeholder="e.g., 10000">
                    </div>
                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label for="interest-rate">Expected Annual Rate of Return (%)</label>
                        <input type="number" id="interest-rate" placeholder="e.g., 7">
                    </div>
                </div>

                <div class="results-summary">
                    <h3>You could have at retirement</h3>
                    <p>₹ <span id="total-savings">0.00</span></p>
                    <div class="result-breakdown">
                        <div>
                            <h4>Total Contributions</h4>
                            <p style="font-size: 1.5rem;">₹ <span id="total-contributions">0.00</span></p>
                        </div>
                        <div>
                            <h4>Total Interest Earned</h4>
                            <p style="font-size: 1.5rem;">₹ <span id="total-interest">0.00</span></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 <a href="https://www.yashdhanjwal.com" target="_blank">Yash Dhanjwal</a> | Powered by Hostingial.com</p>
            <p>Contact: <a href="mailto:info@yashdhanjwal.com">info@yashdhanjwal.com</a> | New Delhi, India | +91 9990033043</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/retirement-savings-calculator.js"></script>
</body>
</html>
